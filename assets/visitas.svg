<svg width="220" height="45" viewBox="0 0 220 45" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0F172A"></stop>
      <stop offset="100%" stop-color="#2563EB"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="216" height="41" rx="12" fill="url(#bg)" stroke="#3B82F6" stroke-width="1"></rect>

  <!-- Icono -->
  <g transform="translate(15 12)" filter="url(#glow)">
    <path d="M1 10s4-7 9-7 9 7 9 7-4 7-9 7-9-7-9-7z" fill="none" stroke="white" stroke-width="1.8"></path>

    <circle cx="10" cy="10" r="3" fill="none" stroke="white" stroke-width="1.8">
      <animate attributeName="r" values="2.5;4;2.5" dur="1.5s" repeatCount="indefinite"></animate>
    </circle>
  </g>

  <text x="43" y="21" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="10" font-weight="600">
    VISITAS
  </text>

  <text x="43" y="34" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Daw2Decroly2027
  </text>

  <!-- Brillo -->
  <rect x="-80" y="2" width="55" height="41" fill="white" opacity="0.08" transform="skewX(-20)">
    <animate attributeName="x" from="-80" to="240" dur="3s" repeatCount="indefinite"></animate>
  </rect>
</svg>
