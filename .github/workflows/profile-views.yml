name: Actualizar contador de visitas

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile-views:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener visitas del perfil
        id: views
        shell: bash
        run: |
          RESPONSE=$(curl -L --silent --show-error --fail \
            "https://komarev.com/ghpvc/?username=JoaquinDecroly&style=flat")

          echo "$RESPONSE"

          VIEWS=$(echo "$RESPONSE" | grep -oE '[0-9]+' | tail -1)

          if ! [[ "$VIEWS" =~ ^[0-9]+$ ]]; then
            echo "ERROR: contador inválido: $VIEWS"
            exit 1
          fi

          echo "Visitas: $VIEWS"
          echo "VIEWS=$VIEWS" >> "$GITHUB_OUTPUT"

      - name: Actualizar solamente el número del SVG
        env:
          VIEWS: ${{ steps.views.outputs.VIEWS }}
        shell: bash
        run: |
          FILE="assets/profile-views.svg"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: No existe $FILE"
            exit 1
          fi

          echo "Número nuevo: $VIEWS"

          sed -i -E \
            "s|(font-size=\"20\"[^>]*>[[:space:]]*)[0-9]+([[:space:]]*</text>)|\1$VIEWS\2|" \
            "$FILE"

          echo "Resultado:"
          grep -A1 'font-size="20"' "$FILE"

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/profile-views.svg

          if git diff --cached --quiet; then
            echo "El contador no ha cambiado."
          else
            git commit -m "chore: actualizar visitas del perfil"
            git push
          fi
